<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAble</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  
  <body>
    <h1>WebAble</h1>
    <p>
      Building for everyone starts here. Explore key accessibility principles — what they mean, why they exist, and how to bring them to life in your projects.
    </p>

    <!-- Perceive -->
    <button class="accordion">ALT Texts</button>
    <div class="panel" id="alt-text-panel">
      
    </div>

    <button class="accordion">Colour Contrast</button>
    <div class="panel" id="colour-contrast-panel">
    
    </div>
    <button class="accordion">Scalable Text</button>
    <div class="panel" id="scalable-text-panel">
     
    </div>

    <button class="accordion">Zooming Content</button>
    <div class="panel" id="zooming-content-panel">
    
    </div>

    <button class="accordion">Full Keyboard Navigation</button>
    <div class="panel" id="full-keyboard-navigation-panel">
     
    </div>

    <button class="accordion">Logical Focus Order</button>
    <div class="panel" id="logical-focus-order-panel">
    
    </div>

    <button class="accordion">Focus Indicators</button>
    <div class="panel" id="focus-indicators-panel">
      
    </div>

     <button class="accordion">Modal Dialogs</button>
    <div class="panel" id="modal-dialogs-panel">

    </div>

    <button class="accordion">Error Messages</button>
    <div class="panel" id="error-messages-panel">
    
    </div>

    <button class="accordion">Form Labels</button>
    <div class="panel" id="form-labels-panel">

    </div>

    <button class="accordion">ARIA Roles</button>
    <div class="panel" id="aria-roles-panel">
    
    </div>

    <section class="other-sources">
      <h2>Other Sources</h2>
      <ul>
        <li><a href="https://www.w3.org/WAI/WCAG22/quickref/" target="_blank" rel="noopener noreferrer">WCAG 2.2 Quick Reference</a></li>
        <li><a href="https://www.w3schools.com/howto/" target="_blank" rel="noopener noreferrer">W3Schools: How To</a></li>
        <li><a href="https://www.w3.org/WAI/standards-guidelines/" target="_blank" rel="noopener noreferrer">W3C WAI Standards &amp; Guidelines</a></li>
      </ul>
    </section>

    <script type="module" src="./main.js"></script>
    <script src="./accordion.js"></script>
  </body>
</html>
